
<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>Conta | NuvionCloud</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 390px;
      padding: 28px;
      background: #182438;
      border: 1px solid #293b54;
      border-radius: 18px;
    }
    h1 { margin-top: 0; }
    h1 span { color: #60a5fa; }
    p { color: #aab8ca; }
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 13px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      color: white;
      background: #101827;
      border: 1px solid #35465f;
      outline: none;
    }
    button {
      border: 0;
      background: #3985ed;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    .secondary { background: #293b54; }
    #message {
      min-height: 20px;
      font-size: 13px;
      overflow-wrap: anywhere;
    }
    a { color: #60a5fa; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Nuvion<span>Cloud</span></h1>
    <p>Entre ou crie sua conta para acessar seu Cloud PC.</p>

    <input id="email" type="email"
      placeholder="Seu e-mail" autocomplete="email">

    <input id="password" type="password"
      placeholder="Sua senha" autocomplete="current-password">

    <button id="loginButton">ENTRAR</button>
    <button id="registerButton" class="secondary">
      CRIAR CONTA
    </button>

    <p id="message" role="status"></p>
    <a href="index.html">Voltar ao início</a>
  </main>

  <script type="module">
    import { cadastrar, entrar } from "./auth.js";

    const email = document.getElementById("email");
    const password = document.getElementById("password");
    const message = document.getElementById("message");
    const loginButton = document.getElementById("loginButton");
    const registerButton = document.getElementById("registerButton");

    function traduzirErro(error) {
      const erros = {
        "auth/invalid-email": "Digite um e-mail válido.",
        "auth/missing-password": "Digite sua senha.",
        "auth/weak-password": "A senha precisa ter pelo menos 6 caracteres.",
        "auth/email-already-in-use": "Este e-mail já possui uma conta.",
        "auth/invalid-credential": "E-mail ou senha incorretos.",
        "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco."
      };
      return erros[error.code] || "Erro: " + error.message;
    }

    async function executar(acao) {
      const e = email.value.trim();
      const s = password.value;

      if (!e || !s) {
        message.textContent = "Preencha o e-mail e a senha.";
        return;
      }

      loginButton.disabled = true;
      registerButton.disabled = true;
      message.textContent = "Aguarde...";

      try {
        const usuario = await acao(e, s);
        message.textContent = "Login realizado! Redirecionando...";
        window.location.href = "index.html";
      } catch (error) {
        message.textContent = traduzirErro(error);
      } finally {
        loginButton.disabled = false;
        registerButton.disabled = false;
      }
    }

    loginButton.addEventListener("click", () => executar(entrar));
    registerButton.addEventListener("click", () => executar(cadastrar));
  </script>
</body>
</html>
